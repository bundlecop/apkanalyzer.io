server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1d;
    }

    location ~* /\.(?!well-known/) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
